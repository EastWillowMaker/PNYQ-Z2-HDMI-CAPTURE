[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litex-hdmi-capture"
version = "0.1.0"
description = "Raw RGB888 TCP client for the PYNQ-Z2 HDMI capture project"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
png = ["Pillow>=10,<13"]
gui = ["Pillow>=10,<13"]
test = ["pytest>=8,<10"]

[project.scripts]
hdmi-capture = "hdmi_capture.cli:main"
hdmi-capture-viewer = "hdmi_capture.viewer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
